[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sectools"
version = "0.1.0"
description = "A small toolkit of automated CLI utilities for everyday security analysis: crypto, email & network forensics, certificates, and data processing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "security",
    "forensics",
    "dfir",
    "pcap",
    "certificates",
    "xor",
    "cli",
]
authors = [{ name = "digitalcomposer" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
# The core is intentionally dependency-free (standard library only) so that
# `pip install sectools` works everywhere. Heavier tools pull optional extras.
dependencies = []

[project.optional-dependencies]
# Richer X.509 parsing for `certscan` (otherwise falls back to the `openssl` CLI).
certs = ["cryptography>=41"]
# Faster, pure-Python pcap parsing for `pcaptriage` (otherwise uses the `tshark` CLI).
pcap = ["scapy>=2.5"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.urls]
Homepage = "https://github.com/digitalcomposer/sectools"
Repository = "https://github.com/digitalcomposer/sectools"
Issues = "https://github.com/digitalcomposer/sectools/issues"

[project.scripts]
sectools = "sectools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sectools"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
packages = ["sectools"]
ignore_missing_imports = true
warn_unused_ignores = true
